server.port=8080

# H2 file database (data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/jobportal
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT: use a long random string (32+ characters) and keep it private
app.jwt.secret=change-this-to-a-long-random-secret-key-at-least-32-chars
app.jwt.expiration-ms=86400000
